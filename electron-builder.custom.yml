# The Pokebots build: Steven's fork of OpenBot, installed as `/Applications/Pokebots.app` next to the
# official OpenBot. `scripts/custom-build-install.sh` builds and installs it. By hand, like
# `bun run package` (package.json), with this config and the brand settings:
#   bun run voice:prepare-runtime && bun run prepare:remote-desktop-runtime &&
#   bun run verify:remote-desktop-runtime && bun run prepare:cua-driver && bun run prepare:macos-photo-picker &&
#   OPENBOT_BRAND_NAME=Pokebots OPENBOT_BRAND_AUTH_API_URL=https://api.pokebots.xyz \
#   OPENBOT_BRAND_SIGNAL_URL=wss://signal.pokebots.xyz/v1/signal bun run build &&
#   bunx electron-builder --dir --mac --arm64 --config electron-builder.custom.yml
# It differs from `electron-builder.yml` in these ways: no `openbot:` link handler, no update feed,
# no signing or notarization, output in `dist-custom`, the name "Pokebots", and a blue icon so it is
# easy to tell from the official lavender app.
# The name: `productName` names the bundle, the Dock tile, the menu bar and the privacy lists of
# System Settings. The text inside the app says Pokebots because of the brand layer
# (`scripts/brand-layer.ts`), which `bun run build` runs when `OPENBOT_BRAND_NAME` is set. The same
# build also defaults to the self-hosted account service `api.pokebots.xyz` and its Signal.
# The legacy icon: `build/custom/icon-custom.icns` (the first Pokebots app's blue headphones
# plush) for Finder and the Dock, and `build/custom/icon-pokebots.png` in place of the release
# icons that the app shows in the Dock while it runs. There is no
# icon catalog (`Assets.car`), because the committed one is lavender; macOS then uses the `.icns`.
# The build is signed ad hoc (`identity: null`), so it must not ask for Apple-restricted
# entitlements (`associated-domains`, `team-identifier`) and must not use the hardened runtime:
# macOS kills an ad hoc app with restricted entitlements at launch ("The signature on the file is
# invalid"), and the hardened runtime refuses to load the separately signed Electron Framework
# ("different Team IDs"). `build/custom/entitlements.custom.plist` is the release list without them.
# The app ID is `app.openbot.custom`, not the release `app.openbot.desktop`. macOS keeps Screen
# Recording and Accessibility grants per app ID, with the signer that it saw. With the release ID,
# the grant entry kept the official signer, so this build never matched it, and removing and adding
# the app again did not help. `scripts/custom-build-install.sh` then signs the app again with a
# local certificate, so the signer stays the same from build to build and a grant stays valid. Do not
# change the app ID or the certificate name "OpenBot Custom Local Signing": the grants would go.
# The data folder and the keychain item "OpenBot Safe Storage" do not change with `productName`:
# Electron names the app from `productName` in `package.json`, which stays "OpenBot", and the app
# sets its name to "OpenBot" again (`src/main/index.ts`).
# Keep the rest of this file in step with `electron-builder.yml`.
appId: app.openbot.custom
productName: Pokebots
copyright: Copyright © 2026 Synthetify Labs spółka z ograniczoną odpowiedzialnością
asar: true
artifactName: ${productName}-${version}-${arch}.${ext}
electronUpdaterCompatibility: ">=2.16"
electronFuses:
  resetAdHocDarwinSignature: true
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: false
publish: null
files:
  - out/**/*
  - package.json
  - LICENSE
  - NOTICE
  - "!node_modules/@anthropic-ai/claude-agent-sdk-darwin-*/**/*"
  - "!node_modules/@anthropic-ai/claude-agent-sdk-linux-*/**/*"
  - "!node_modules/@anthropic-ai/claude-agent-sdk-win32-*/**/*"
asarUnpack:
  - out/main/agent-database-host.js
  - out/main/voice-transcription-host.js
  - out/main/voice-speech-host.js
  - node_modules/effect/**/*
  - node_modules/@koromix/koffi-*/**/*
extraResources:
  - from: resources/managed-skills
    to: managed-skills
  - from: resources/plugin-catalog
    to: plugin-catalog
  - from: resources/agent-import
    to: agent-import
  - from: resources/cli
    to: cli
  - from: resources/agent-runtime
    to: agent-runtime
  - from: build/custom/icon-pokebots.png
    to: icons/icon-production.png
  - from: build/icon-dev.png
    to: icons/icon-dev.png
  - from: build/icon-preview.png
    to: icons/icon-preview.png
  - from: build/logo-colors
    to: icons/logo-colors
  - from: node_modules/electron/dist/LICENSE
    to: licenses/Electron-LICENSE
  - from: node_modules/electron/dist/LICENSES.chromium.html
    to: licenses/LICENSES.chromium.html
  - from: build/licenses/sherpa-onnx-LICENSE
    to: licenses/sherpa-onnx-LICENSE
  - from: build/licenses/onnxruntime-LICENSE
    to: licenses/onnxruntime-LICENSE
  - from: build/licenses/NVIDIA-Parakeet-TDT-0.6B-v3-LICENSE
    to: licenses/NVIDIA-Parakeet-TDT-0.6B-v3-LICENSE
  - from: build/licenses/Underdog-Bark-3.0-Plus-LICENSE
    to: licenses/Underdog-Bark-3.0-Plus-LICENSE
  - from: build/licenses/OpenAI-Whisper-LICENSE
    to: licenses/OpenAI-Whisper-LICENSE
  - from: build/licenses/Supertone-Supertonic-3-LICENSE
    to: licenses/Supertone-Supertonic-3-LICENSE
directories:
  output: dist-custom
toolsets:
  appimage: 1.0.3
mac:
  category: public.app-category.productivity
  minimumSystemVersion: "13.0"
  notarize: false
  hardenedRuntime: false
  icon: build/custom/icon-custom.icns
  extraResources:
    - from: build/custom/icon-pokebots-safe-area.png
      to: icons/icon-production-macos-safe-area.png
    - from: build/icon-dev-macos-safe-area.png
      to: icons/icon-dev-macos-safe-area.png
    - from: build/icon-preview-macos-safe-area.png
      to: icons/icon-preview-macos-safe-area.png
    - from: build/macos/tray
      to: icons/tray
      filter:
        - "*.png"
    - from: .openbot-build/voice/runtime
      to: voice/runtime
    - from: build/remote-desktop-runtime
      to: remote-desktop-runtime
    - from: build/cua-driver/darwin/${arch}
      to: cua-driver/darwin/${arch}
    - from: .openbot-build/macos-photo-picker
      to: macos-photo-picker
  signIgnore:
    - Contents/Resources/cua-driver/
  entitlements: build/custom/entitlements.custom.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  darkModeSupport: true
  extendInfo:
    ElectronTeamID: ZTRDTUL87R
    NSMicrophoneUsageDescription: Pokebots uses the microphone to transcribe voice
      prompts locally on this Mac.
    NSScreenCaptureUsageDescription: Pokebots captures the screen so an agent can see
      the app windows you ask it to control.
    NSAppleEventsUsageDescription: Pokebots sends Automation events so an agent can
      control the apps you ask it to control.
    NSUserActivityTypes:
      - NSUserActivityTypeBrowsingWeb
    CFBundleDisplayName: Pokebots
  target:
    - dmg
    - zip
  identity: null
win:
  icon: build/icon-production.ico
  extraResources:
    - from: .openbot-build/voice/runtime
      to: voice/runtime
    - from: build/remote-desktop-runtime
      to: remote-desktop-runtime
    - from: build/cua-driver/win32/x64
      to: cua-driver/win32/x64
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  category: Development
  icon: build/icon-production.png
  synopsis: A local-first multi-agent desktop workspace.
  extraResources:
    - from: build/linux/openbot.apparmor
      to: linux/openbot.apparmor
    - from: scripts/hosting
      to: hosting
      filter:
        - "**/*"
        - "!*.ts"
    - from: .openbot-build/voice/runtime
      to: voice/runtime
    - from: build/remote-desktop-runtime
      to: remote-desktop-runtime
    - from: build/cua-driver/linux/${arch}
      to: cua-driver/linux/${arch}
  syncDesktopName: true
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
dmg:
  title: ${productName} ${version}
  background: build/dmg-background.png
  iconSize: 128
  iconTextSize: 14
  window:
    x: 400
    y: 467
    width: 680
    height: 506
  contents:
    - x: 190
      y: 220
    - x: 490
      y: 220
      type: link
      path: /Applications
