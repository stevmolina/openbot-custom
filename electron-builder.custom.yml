# The OpenBot Custom build: Steven's fork, installed next to the official OpenBot.
# Build with `bunx electron-builder --dir --mac --arm64 --config electron-builder.custom.yml`.
# It differs from `electron-builder.yml` in these ways: no `openbot:` link handler, no update feed,
# no signing or notarization, output in `dist-custom`, the name "OpenBot Custom", and a green icon
# so it is easy to tell from the official lavender app.
# The green icon: `build/custom/icon-custom.icns` for Finder and the Dock, and the green logo-color
# files in place of the release icons that the app shows in the Dock while it runs. There is no
# icon catalog (`Assets.car`), because the committed one is lavender; macOS then uses the `.icns`.
# Keep the rest of this file in step with `electron-builder.yml`.
appId: app.openbot.desktop
productName: OpenBot
copyright: Copyright © 2026 Synthetify Labs spółka z ograniczoną odpowiedzialnością
asar: true
artifactName: ${productName}-${version}-${arch}.${ext}
electronUpdaterCompatibility: ">=2.16"
electronFuses:
  resetAdHocDarwinSignature: true
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: false
publish: null
files:
  - out/**/*
  - package.json
  - LICENSE
  - NOTICE
  - "!node_modules/@anthropic-ai/claude-agent-sdk-darwin-*/**/*"
  - "!node_modules/@anthropic-ai/claude-agent-sdk-linux-*/**/*"
  - "!node_modules/@anthropic-ai/claude-agent-sdk-win32-*/**/*"
asarUnpack:
  - out/main/agent-database-host.js
  - out/main/voice-transcription-host.js
  - out/main/voice-speech-host.js
  - node_modules/effect/**/*
  - node_modules/@koromix/koffi-*/**/*
extraResources:
  - from: resources/managed-skills
    to: managed-skills
  - from: resources/plugin-catalog
    to: plugin-catalog
  - from: resources/agent-import
    to: agent-import
  - from: resources/cli
    to: cli
  - from: resources/agent-runtime
    to: agent-runtime
  - from: build/logo-colors/icon-green.png
    to: icons/icon-production.png
  - from: build/icon-dev.png
    to: icons/icon-dev.png
  - from: build/icon-preview.png
    to: icons/icon-preview.png
  - from: build/logo-colors
    to: icons/logo-colors
  - from: node_modules/electron/dist/LICENSE
    to: licenses/Electron-LICENSE
  - from: node_modules/electron/dist/LICENSES.chromium.html
    to: licenses/LICENSES.chromium.html
  - from: build/licenses/sherpa-onnx-LICENSE
    to: licenses/sherpa-onnx-LICENSE
  - from: build/licenses/onnxruntime-LICENSE
    to: licenses/onnxruntime-LICENSE
  - from: build/licenses/NVIDIA-Parakeet-TDT-0.6B-v3-LICENSE
    to: licenses/NVIDIA-Parakeet-TDT-0.6B-v3-LICENSE
  - from: build/licenses/Underdog-Bark-3.0-Plus-LICENSE
    to: licenses/Underdog-Bark-3.0-Plus-LICENSE
  - from: build/licenses/OpenAI-Whisper-LICENSE
    to: licenses/OpenAI-Whisper-LICENSE
  - from: build/licenses/Supertone-Supertonic-3-LICENSE
    to: licenses/Supertone-Supertonic-3-LICENSE
directories:
  output: dist-custom
toolsets:
  appimage: 1.0.3
mac:
  category: public.app-category.productivity
  minimumSystemVersion: "13.0"
  notarize: false
  hardenedRuntime: true
  icon: build/custom/icon-custom.icns
  extraResources:
    - from: build/logo-colors/icon-green-macos-safe-area.png
      to: icons/icon-production-macos-safe-area.png
    - from: build/icon-dev-macos-safe-area.png
      to: icons/icon-dev-macos-safe-area.png
    - from: build/icon-preview-macos-safe-area.png
      to: icons/icon-preview-macos-safe-area.png
    - from: build/macos/tray
      to: icons/tray
      filter:
        - "*.png"
    - from: .openbot-build/voice/runtime
      to: voice/runtime
    - from: build/remote-desktop-runtime
      to: remote-desktop-runtime
    - from: build/cua-driver/darwin/${arch}
      to: cua-driver/darwin/${arch}
  signIgnore:
    - Contents/Resources/cua-driver/
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  darkModeSupport: true
  extendInfo:
    ElectronTeamID: ZTRDTUL87R
    NSMicrophoneUsageDescription: OpenBot uses the microphone to transcribe voice
      prompts locally on this Mac.
    NSScreenCaptureUsageDescription: OpenBot captures the screen so an agent can see
      the app windows you ask it to control.
    NSAppleEventsUsageDescription: OpenBot sends Automation events so an agent can
      control the apps you ask it to control.
    NSUserActivityTypes:
      - NSUserActivityTypeBrowsingWeb
    CFBundleDisplayName: OpenBot Custom
  target:
    - dmg
    - zip
  identity: null
win:
  icon: build/icon-production.ico
  extraResources:
    - from: .openbot-build/voice/runtime
      to: voice/runtime
    - from: build/remote-desktop-runtime
      to: remote-desktop-runtime
    - from: build/cua-driver/win32/x64
      to: cua-driver/win32/x64
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  category: Development
  icon: build/icon-production.png
  synopsis: A local-first multi-agent desktop workspace.
  extraResources:
    - from: build/linux/openbot.apparmor
      to: linux/openbot.apparmor
    - from: scripts/hosting
      to: hosting
      filter:
        - "**/*"
        - "!*.ts"
    - from: .openbot-build/voice/runtime
      to: voice/runtime
    - from: build/remote-desktop-runtime
      to: remote-desktop-runtime
    - from: build/cua-driver/linux/${arch}
      to: cua-driver/linux/${arch}
  syncDesktopName: true
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
dmg:
  title: ${productName} ${version}
  background: build/dmg-background.png
  iconSize: 128
  iconTextSize: 14
  window:
    x: 400
    y: 467
    width: 680
    height: 506
  contents:
    - x: 190
      y: 220
    - x: 490
      y: 220
      type: link
      path: /Applications
